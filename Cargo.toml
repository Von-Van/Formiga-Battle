[workspace]
members = [
    "crates/formiga-battle",
    "crates/formiga-battle-core",
    "crates/formiga-battle-room",
    "crates/formiga-battle-world",
]
resolver = "2"

[workspace.package]
version = "0.67.14"
edition = "2024"
rust-version = "1.97"
authors = ["Formiga contributors"]
license = "MIT"
publish = false

[workspace.dependencies]
# Formiga Desktop's shared crates, all from the same Desktop release so their types agree.
# Until the Desktop release with Battle contract version 5 is tagged they come from the Desktop
# commit that keeps the anonymous Handler key (desktop-battle-handler-key); the release replaces
# each `rev = "…"` with that release's tag.
# Move them to a new release's tag together.
formiga-art = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "76cc29bfa71775138dd3ae4047225a3bc04c75c6" }
formiga-battle-contract = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "76cc29bfa71775138dd3ae4047225a3bc04c75c6" }
formiga-core = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "76cc29bfa71775138dd3ae4047225a3bc04c75c6" }
formiga-expansion-rulebook = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "76cc29bfa71775138dd3ae4047225a3bc04c75c6" }
formiga-travel = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "76cc29bfa71775138dd3ae4047225a3bc04c75c6" }
# The notebooks' pencil hand, from Desktop's branch until a Desktop release carries it; then by the
# same tag as the rest.
formiga-pencil = { git = "https://github.com/Von-Van/Formiga-Desktop", branch = "desktop-pencil-notebook" }

formiga-battle-core = { path = "crates/formiga-battle-core" }
formiga-battle-room = { path = "crates/formiga-battle-room" }
formiga-battle-world = { path = "crates/formiga-battle-world" }

anyhow = "1.0.104"
directories = "5.0.1"
eframe = "0.36.2"
getrandom = "0.4.3"
png = "0.18.1"
# Playback only: every sound is made in code, as Formiga Hill makes its own, so there is nothing
# to decode.
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }

# Every frame of the board is painted pixel by pixel; even a debug build should keep up.
[profile.dev.package.formiga-art]
opt-level = 2

# The rules and every other crate are optimized in debug builds too, so the checks that play whole
# tournaments run in seconds. The rules use whole numbers only, so this cannot change a result.
[profile.dev.package.formiga-battle-core]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
