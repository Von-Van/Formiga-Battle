[workspace]
members = [
    "crates/formiga-battle",
    "crates/formiga-battle-core",
    "crates/formiga-battle-room",
]
resolver = "2"

[workspace.package]
version = "0.67.8"
edition = "2024"
rust-version = "1.97"
authors = ["Formiga contributors"]
license = "MIT"
publish = false

[workspace.dependencies]
# Formiga Desktop's shared crates, all from the same Desktop release so their types agree.
# Move them to a new release's tag together. Until 0.67.9 is tagged they come from the Desktop
# main commit that keeps the Handler card (contract v3, save v32); the release replaces each
# `rev = "…"` with `tag = "v0.67.9"` by hand before running scripts/set-version.sh.
formiga-art = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "112cf08c58bf0b8418c801188cdc5305cbcea577" }
formiga-battle-contract = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "112cf08c58bf0b8418c801188cdc5305cbcea577" }
formiga-core = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "112cf08c58bf0b8418c801188cdc5305cbcea577" }
formiga-expansion-rulebook = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "112cf08c58bf0b8418c801188cdc5305cbcea577" }
formiga-travel = { git = "https://github.com/Von-Van/Formiga-Desktop", rev = "112cf08c58bf0b8418c801188cdc5305cbcea577" }

formiga-battle-core = { path = "crates/formiga-battle-core" }
formiga-battle-room = { path = "crates/formiga-battle-room" }

anyhow = "1.0.104"
directories = "5.0.1"
eframe = "0.36.2"
getrandom = "0.4.3"
png = "0.18.1"
# Playback only: every sound is made in code, as Formiga Hill makes its own, so there is nothing
# to decode.
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "parsing", "serde"] }

# Every frame of the board is painted pixel by pixel; even a debug build should keep up.
[profile.dev.package.formiga-art]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
